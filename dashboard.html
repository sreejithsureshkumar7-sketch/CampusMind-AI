<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusMind AI Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="logo">CM</div>
    <h2>CampusMind AI</h2>
    <p id="userEmail">Loading...</p>
    <button id="logoutBtn">Logout</button>
  </aside>

  <main class="dashboard">
    <section class="hero">
      <h1>Smart Student Analytics</h1>
      <p>Login protected AI + Data Analytics dashboard.</p>
    </section>

    <section class="grid">
      <div class="card"><h3>Total Students</h3><strong id="totalStudents">0</strong></div>
      <div class="card"><h3>Avg Attendance</h3><strong id="avgAttendance">0%</strong></div>
      <div class="card"><h3>Avg Marks</h3><strong id="avgMarks">0%</strong></div>
      <div class="card"><h3>High Risk</h3><strong id="highRisk">0</strong></div>
    </section>

    <section class="panel">
      <h2>Add / Edit Student Data</h2>
      <form id="studentForm">
        <input id="name" placeholder="Student Name" required />
        <input id="department" placeholder="Department" required />
        <input id="attendance" type="number" placeholder="Attendance %" required />
        <input id="marks" type="number" placeholder="Marks %" required />
        <input id="skills" type="number" placeholder="Skills %" required />
        <button type="submit">Save Student</button>
      </form>
    </section>

    <section class="panel">
      <h2>Student List</h2>
      <div id="studentList"></div>
    </section>
  </main>

  <script src="firebase-config.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
